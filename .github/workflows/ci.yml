name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and dev tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Test
        run: pytest
      - name: Frozen rule baselines and cassette replay (offline)
        run: python -m app.eval check

  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      M2_TEST_DATABASE_URL: postgresql+asyncpg://agentops:agentops@localhost:5432/agentops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and dev tools
        run: pip install -e ".[dev]"
      - name: Start the documented Postgres deployment
        run: docker compose up -d --wait
      - name: Migrate and exercise CLI, SSE, idempotency and process restart
        run: pytest -q tests/test_m2_acceptance.py
      - name: Postgres diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the disposable database
        if: always()
        run: docker compose down -v
