# Root cause is the payments connection pool. Checkout only shows a timeout.
# A sweep of the incident service never reads the payments database.
id: multihop-checkout-payments-pool
title: "Checkout stalls while calling payments"
service: checkout
tags: [fault, multi_hop, database, red_herring]
