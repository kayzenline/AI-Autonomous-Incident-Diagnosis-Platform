# Stale v1.4 memory blames local checkout config_error, while v2.0 episodic
# memory notes that checkout v2.0 delegates order writes to downstream `payments`
# (which is the 3rd dependency behind healthy `auth` and `catalog`).
id: stale-service-checkout-v2-pool
title: "Checkout v2.0 downstream payments pool exhaustion with stale v1.4 memory"
service: checkout
tags: [fault, stale_memory, multi_hop, database]
holdout: false
incident:
  title: Checkout order submission failing after v2.0 split
  description: Checkout order submissions are failing with upstream 5xx in v2.0.
  service: checkout
  occurred_at: 2026-10-28T12:00:00Z
  detected_at: 2026-10-28T12:10:00Z
  user_severity: high
  metadata:
    service_version: "v2.0"
world:
  services: [checkout, auth, catalog, payments]
  metrics_unavailable: false
  metrics:
