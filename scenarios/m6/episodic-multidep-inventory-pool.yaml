# Episodic memory from a prior flash-sale incident on `order-service` guides the
# investigator past decoy dependencies (`user-profile`, `notifications`) directly
# to `inventory-db-proxy`, where DB pool exhaustion is verified by current tools.
id: episodic-multidep-inventory-pool
title: "Order reservation failures with 3 downstream dependencies"
service: order-service
tags: [fault, episodic_clue, multi_hop, database]
holdout: false
incident:
  title: Order reservation timeouts under flash sale
  description: Order reservations are failing with 5xx responses during flash sale load.
  service: order-service
  occurred_at: 2026-10-28T14:00:00Z
  detected_at: 2026-10-28T14:10:00Z
  user_severity: high
  metadata:
    service_version: "v2.0"
world:
  services: [order-service, user-profile, notifications, inventory-db-proxy]
  metrics_unavailable: false
  metrics:
